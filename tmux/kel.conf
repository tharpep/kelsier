# kelsier — sourced from ~/.tmux.conf by install.sh
#
# Key story (all lowercase; the tmux prefix is NOT changed):
#   `           jump to the next agent waiting on you
#   Ctrl+Space  the board — find any agent (also prefix b). tab acts on the
#               highlighted one; ctrl-f opens the dashboard / config / sweep
#               / restore / prune / doctor — nothing about one agent
#   prefix m    the SAME per-agent menu as the board's tab, for whichever
#               window you're standing in right now — no board needed
#   prefix k    kel cheat — the keybinding + command reference (v0.9: this
#               used to be an action menu, and every item in it turned out to
#               already be reachable elsewhere — a native tmux default, a
#               kel top-level binding, or now ctrl-f / prefix m)

# --- fleet status line ---
# Each group's tmux session gets its own status-left (set by kel).  This global
# default covers the pre-v0.2 flat session and non-kel sessions.
set -g status-left-length 200
set -g status-left "#($HOME/.local/bin/kel status-line)"
set -g status-interval 15
set -g window-status-format ""
set -g window-status-current-format ""

# --- windows count from 1 (matches prefix 1..9); compact when one closes ---
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# --- label panes so a split isn't a mystery ---
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{pane_current_command} "

# --- mouse: scroll, click a pane to focus, drag a border to resize ---
# (text selection then needs Shift+drag)
set -g mouse on
# wheel: forward to apps that grab the mouse (nvim, lazygit); send PageUp/PageDown
# to any other full-screen TUI — that's how Claude Code scrolls its conversation;
# tmux scrollback for a plain shell.
bind -n WheelUpPane   if -Ft= "#{mouse_any_flag}" "send -M" "if -Ft= \"#{alternate_on}\" \"send -N3 PageUp\"   \"copy-mode -e\""
bind -n WheelDownPane if -Ft= "#{mouse_any_flag}" "send -M" "if -Ft= \"#{alternate_on}\" \"send -N3 PageDown\" \"copy-mode -e\""

# --- jump to the next waiting agent (any group) ---
bind-key "`" run-shell "$HOME/.local/bin/kel jump"

# --- snapshot the workspace shape whenever it changes / on detach ---
# (so `prefix d` — plain detach — already saves; there is no separate key)
set-hook -g client-detached      "run-shell -b '$HOME/.local/bin/kel snapshot'"
set-hook -g after-split-window   "run-shell -b '$HOME/.local/bin/kel snapshot'"
set-hook -g pane-exited          "run-shell -b '$HOME/.local/bin/kel snapshot'"

# --- the board: find any agent (filter / preview; enter jumps, tab = actions) ---
# Ctrl+Space (no prefix) and prefix b both open it. To drop the no-prefix
# chord, comment out the next line.
# `kel board` opens its own popup now (see cmd_board), so the keybinding and a
# shell `kel board` behave identically. Size: $KEL_BOARD_W / $KEL_BOARD_H.
bind -n C-Space run-shell -b "$HOME/.local/bin/kel board"
bind-key b      run-shell -b "$HOME/.local/bin/kel board"

# --- prefix m: the per-agent menu, for the window you're standing in ---
# Not a second menu: cmd_here_actions gathers this window's own wid/name/
# group/cwd and calls the exact same cmd_board_actions the board's tab key
# calls, with the "here" extra that turns on move/adopt/relaunch — those three
# only know how to act on "whichever pane I was invoked from" (no explicit
# wid), correct for prefix m, wrong for an arbitrary highlighted board row.
# See cmd_board_actions in bin/kel. One action list, reachable two ways.
bind-key m run-shell -b "$HOME/.local/bin/kel _here"

# --- prefix t: the fleet dashboard (replaces tmux's clock — no loss) ---
bind-key t run-shell -b "$HOME/.local/bin/kel top"

# --- group picker (session tree; kel groups are the kel/* sessions) ---
bind-key g choose-tree -Zs

# --- rename the current window AND keep kel's metadata in sync ---
bind-key "," command-prompt -I "#W" { run-shell "$HOME/.local/bin/kel rename '%%'" }

# --- intuitive split keys (the defaults % and " still work) ---
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "-" split-window -v -c "#{pane_current_path}"

# --- prefix k: kel cheat — the reference, not a menu (v0.9) ---
# Every item this menu used to have, checked one by one, was ALREADY reachable
# somewhere else: new/worktree/rename are ctrl-f→board or prefix m; browse is
# Ctrl+Space itself; jump-to-waiting is prefix ` directly; sweep/restore/
# prune/doctor moved to the board's ctrl-f; switch-group/scroll/split/zoom/
# close/detach were ALL already native tmux defaults or kel top-level
# bindings this menu never actually needed to wrap (prefix w, prefix [,
# prefix |/-, prefix z, prefix &, prefix d — none of them touched by kel).
# Wrapping "press prefix, then press the native key" in a submenu is strictly
# MORE steps than pressing the native key. Nothing here was actually earning
# its place; the same command "show me around" already ran is now what the
# whole key does.
bind-key k display-popup -w 84 -h 85% -T ' kel keys ' -E "$HOME/.local/bin/kel cheat | less -R"

# --- let Neovim's OSC 52 clipboard reach the Windows clipboard through tmux ---
set -g allow-passthrough on
