# kelsier — sourced from ~/.tmux.conf by install.sh
#
# Keys (all lowercase; the tmux prefix is NOT changed):
#   prefix `    jump to the next agent waiting on you
#   prefix Space  the sidebar takes the keys; esc gives them back
#
# v0.10 also put every window in one session, so prefix g (pick a session)
# went: prefix 1..9 and prefix w reach everything.
#
# v0.10 removed the fzf board (Ctrl+Space / prefix b), the per-agent menu
# (prefix m) and kel cheat (prefix k): four overlapping surfaces with four
# key schemes.  The sidebar replaces them — docs/rollout.md § v0.10.  kel top
# (prefix t) went too, once the sidebar showed all it did: one surface.

# --- fleet status line ---
# One global status-left: since v0.10 every kel window is in one session.
# (A v0.9 per-repo session still running carries its own; it drains away.)
set -g status-left-length 200
set -g @kel-bar-lead '#{?#{&&:#{P:#{?@kel-sidebar,1,}},#{?window_zoomed_flag,,1}},#[bg=#000000 dim]#{?#{P:#{?#{&&:#{@kel-sidebar},#{pane_active}},1,}},#{@kel-hint-in},#{@kel-hint-out}}#[bg=default nodim fg=colour238]│ #[default],}'
set -g status-left "#{E:@kel-bar-lead}#($HOME/.local/bin/kel status-line)"
set -g status-interval 15
set -g window-status-format ""
set -g window-status-current-format ""

# --- windows count from 1 (matches prefix 1..9); compact when one closes ---
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# --- label panes so a split isn't a mystery ---
set -g pane-border-status top
# the sidebar's own border says nothing — "kel-sidebar" there was noise
# and a window with one pane of yours needs no label at all: "2 claude" (the
# pane's number, then the program) told the author nothing. Once you split,
# each pane says which it is. (#{e|...} is tmux 3.2+.)
set -g @kel-pane-dead '#{&&:#{m/r:^(idle|working|waiting|throttled)$,#{@kel-state}},#{m/r:^(bash|zsh|fish|sh|dash)$,#{pane_current_command}}}'
set -g @kel-pane-word '#{?#{E:@kel-pane-dead},dead,#{@kel-state}}'
set -g @kel-pane-col '#{?#{E:@kel-pane-dead},red,#{?#{==:#{@kel-state},waiting},yellow,#{?#{==:#{@kel-state},working},cyan,#{?#{==:#{@kel-state},throttled},magenta,brightblack}}}}'
set -g @kel-pane-title ' #{?@kel-state,#[fg=#{E:@kel-pane-col}]●#[default] ,}#{pane_index} · #{?@kel-name,#{@kel-name},#{pane_current_command}}#{?@kel-state, #[fg=#{E:@kel-pane-col}]#{E:@kel-pane-word}#[default],} '
set -g pane-border-format "#{?@kel-sidebar,,#{?#{e|>:#{e|-:#{window_panes},#{?#{P:#{?@kel-sidebar,1,}},1,0}},1},#{E:@kel-pane-title},}}"

# --- quiet colours ---
# tmux's defaults are a bright green status bar and a green active border.
# Borders are a dim grey, the pane you are in a muted purple; the bar is dark.
# Only states that need you colour a window's borders (see paint_state in
# bin/kel): waiting (orange) and dead (red).
set -g pane-border-style        "fg=colour238"
set -g pane-active-border-style "fg=colour97"
# The bar is black, like the sidebar: the author did not like the grey band.
# Its right side was tmux's default — "window name" HH:MM DD-Mon-YY — noise
# beside kel's own; just the time, grey.
set -g status-style             "bg=default,fg=colour248"
set -g status-right-length      60
set -g status-right             "#{?window_zoomed_flag,#[range=user|unzoom]#[fg=colour255] ⤢ zoomed · click to restore #[norange]  ,}#[fg=colour240]%H:%M "

# --- clicks on a status line: a popup's `✕ close`, the bar's waiting count ---
# (tmux 3.2+ ranges.) Elsewhere on the bar a click does nothing — kel's bar
# has no window list to click
bind-key -n MouseDown1Status run-shell -b "$HOME/.local/bin/kel _click '#{mouse_status_range}' '#{@kel-popup}' '#{client_name}' >/dev/null 2>&1"

# --- prefix k: type a kel command without leaving the agent you are in ---
# a one-line answer comes back as a message, a longer one in a popup
bind-key k command-prompt -p "kel" "run-shell -b \"$HOME/.local/bin/kel _prompt '%%' >/dev/null 2>&1\""

# --- prefix q: close the popup you are in ---
# Every kel popup hosts a small tmux session (@kel-popup), because a popup
# takes every key and a tool inside it can hand you to another — yazi to vim,
# where `q` records a macro. In those sessions prefix q detaches, closing the
# popup whatever runs in it; everywhere else it is tmux's display-panes, as
# before.
bind-key q if-shell -F '#{@kel-popup}' 'detach-client' 'display-panes'

# --- focus: tell each pane when it gains or loses the keyboard ---
# the sidebar shows its keys only while it has focus, and "prefix space"
# otherwise; nvim and others use the same events to autoread and the like
set -g focus-events on

# --- mouse: scroll, click a pane to focus, drag a border to resize ---
# (a drag selects and copies — see the clipboard block below; shift+drag is
# the terminal's own selection, needed where an app grabs the mouse)
set -g mouse on
# wheel: forward to apps that grab the mouse (nvim, lazygit); send PageUp/PageDown
# to any other full-screen TUI — that's how Claude Code scrolls its conversation;
# tmux scrollback for a plain shell.
# One page per notch, not three: a notch is the smallest scroll a person can
# ask for, so sending three pages for one moves the screen further than the
# gesture meant and reads as a jump rather than a scroll.
# Up enters copy mode AND scrolls in one notch; down at the live view does
# nothing. Down once took the same `copy-mode -e` branch, which entered copy
# mode without moving — the screen stopped updating while looking unchanged,
# `[0/1999]` in the corner, until esc. tmux's own default has no down branch.
# -e then leaves copy mode by itself when the wheel scrolls back to the bottom.
# Pinned by "the wheel down never enters copy mode".
bind -n WheelUpPane   if -Ft= "#{mouse_any_flag}" "send -M" "if -Ft= \"#{alternate_on}\" \"send -N1 PageUp\" \"copy-mode -e -t= ; send -X -t= -N 5 scroll-up\""
bind -n WheelDownPane if -Ft= "#{mouse_any_flag}" "send -M" "if -Ft= \"#{alternate_on}\" \"send -N1 PageDown\""

# --- a drag-selection reaches the SYSTEM clipboard ---
# tmux's own `set-clipboard external` sends OSC 52 and decides the terminal
# can take it from TERM — xterm-256color matches its `xterm*:clipboard`
# feature.  Apple Terminal sets that TERM and does not implement OSC 52, so a
# selection landed in tmux's buffer and the Mac clipboard stayed empty
# (measured 2026-10-19).  Piping to a real command is the only mechanism that
# does not depend on the terminal; `kel _copy` picks one per platform.
# Both tables: mode-keys follows the user's $EDITOR, so either may be active.
# The highlight still clears on release — that is `-and-cancel`, which is how
# tmux says "copied", and keeping it is tmux's own behaviour, not a bug.
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "'$HOME/.local/bin/kel' _copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "'$HOME/.local/bin/kel' _copy"
# the keyboard copies too: Ctrl-b [ , select, Enter
bind -T copy-mode    Enter send -X copy-pipe-and-cancel "'$HOME/.local/bin/kel' _copy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "'$HOME/.local/bin/kel' _copy"
# double- and triple-click keep their tmux meaning, with the same destination
bind -T copy-mode    DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-and-cancel "'$HOME/.local/bin/kel' _copy"
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-and-cancel "'$HOME/.local/bin/kel' _copy"
bind -T copy-mode    TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-and-cancel "'$HOME/.local/bin/kel' _copy"
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-and-cancel "'$HOME/.local/bin/kel' _copy"
# ...and outside copy mode, where a double-click is usually made: tmux's
# default for these, with the copy sent through kel rather than nowhere
# No `copy-mode -H` or `run-shell -d` (tmux's own default has both, to flash
# the selection): both postdate kel's tmux 3.0 floor, and one unknown flag
# fails the whole binding, as `run-shell -E` once did.
bind -n DoubleClick1Pane select-pane -t= \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send -M" "copy-mode ; send -X select-word ; send -X copy-pipe-and-cancel \"'$HOME/.local/bin/kel' _copy\""
bind -n TripleClick1Pane select-pane -t= \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send -M" "copy-mode ; send -X select-line ; send -X copy-pipe-and-cancel \"'$HOME/.local/bin/kel' _copy\""

bind -n MouseDrag1Border set-option -wF @kel-drag-b '#{pane-border-style}' \; set-option -wF @kel-drag-a '#{pane-active-border-style}' \; set-option -w pane-border-style fg=blue \; set-option -w pane-active-border-style fg=blue \; resize-pane -M \; set-option -w pane-border-lines heavy
bind -n MouseDragEnd1Border set-option -wF pane-border-style '#{@kel-drag-b}' \; set-option -wF pane-active-border-style '#{@kel-drag-a}' \; set-option -wu pane-border-lines

# --- jump to the next waiting agent (any group) ---
bind-key "`" run-shell "$HOME/.local/bin/kel jump"

# --- snapshot the workspace shape whenever it changes / on detach ---
# (so `prefix d` — plain detach — already saves; there is no separate key)
#
# Every hook discards its output, on purpose: run-shell shows a command's
# stdout in view-mode on the active pane, and `kel snapshot` prints where it
# wrote.  Unsilenced, every split put the pane you were in into view-mode
# showing "kel snapshot -> …" — swallowing your keys until you pressed q.
set-hook -g client-detached      "run-shell -b '$HOME/.local/bin/kel snapshot >/dev/null 2>&1'"
set-hook -g after-split-window   "run-shell -b '$HOME/.local/bin/kel snapshot >/dev/null 2>&1'"
set-hook -g pane-exited          "run-shell -b '$HOME/.local/bin/kel _sidebar reap >/dev/null 2>&1; $HOME/.local/bin/kel snapshot >/dev/null 2>&1'"

# --- the sidebar (v0.10 M2): a fixed-width pane on the left of every kel window ---
# ensure is idempotent and ignores non-kel windows, so these may fire freely;
# kel new adds the sidebar itself — the hooks cover windows made by hand.
# reap (above) closes a window left holding only its sidebar.  `kel sidebar
# off` turns all of this off.
set-hook -g after-new-window       "run-shell -b '$HOME/.local/bin/kel _sidebar ensure #{window_id} >/dev/null 2>&1'"
set-hook -g session-created        "run-shell -b '$HOME/.local/bin/kel _sidebar ensure #{window_id} >/dev/null 2>&1'"
# prefix Space: keys go to the sidebar; esc there comes back.  This takes the
# key from tmux's next-layout, which cycles your splits through preset layouts
# — kel never rearranges your panes, and you can still reach it as prefix M-1..5
bind-key Space run-shell "$HOME/.local/bin/kel _sidebar focus '#{window_id}' >/dev/null 2>&1"
# a hidden sidebar does nothing until it is shown; these tell it it may be
set-hook -g session-window-changed "run-shell -b '$HOME/.local/bin/kel _sidebar wake >/dev/null 2>&1; $HOME/.local/bin/kel _sidebar heal >/dev/null 2>&1; $HOME/.local/bin/kel _banner seen >/dev/null 2>&1'"
set-hook -g client-session-changed "run-shell -b '$HOME/.local/bin/kel _sidebar wake >/dev/null 2>&1'"
# tmux resizes panes proportionally; keep the sidebar its configured width
set-hook -g window-resized         "run-shell -b '$HOME/.local/bin/kel _sidebar fit >/dev/null 2>&1'"
set-hook -g window-layout-changed  "if-shell -F '#{P:#{?@kel-sidebar,#{?window_zoomed_flag,,#{?#{&&:#{&&:#{pane_at_left},#{&&:#{pane_at_top},#{pane_at_bottom}}},#{==:#{pane_width},#{@kel-sidebar-width}}},,1}},}}' \"run-shell -b '$HOME/.local/bin/kel _sidebar fit >/dev/null 2>&1'\""
bind-key C-o rotate-window    \; run-shell -b "$HOME/.local/bin/kel _sidebar fit >/dev/null 2>&1"
bind-key M-o rotate-window -D \; run-shell -b "$HOME/.local/bin/kel _sidebar fit >/dev/null 2>&1"
set-hook -g pane-focus-in          "if-shell -F '#{&&:#{@kel-sidebar},#{?@kel-via,,1}}' 'select-pane -t :.+' ; if-shell -F '#{?@kel-sidebar,,1}' 'set-option -wu @kel-via'"
bind -n MouseDown1Pane if-shell -F -t = '#{@kel-sidebar}' 'set-option -w -t = @kel-via 1' \; select-pane -t = \; send-keys -M


# --- rename the current window AND keep kel's metadata in sync ---
# `2>&1`: run-shell shows stdout, never stderr, and `kel rename` refuses a bad
# name with die — without it the refusal vanished and nothing was renamed.
# Not `run-shell -E`, which is tmux 3.6+ against kel's 3.0 floor.
bind-key "," command-prompt -I "#W" { run-shell "$HOME/.local/bin/kel rename '%%' 2>&1" }

# --- intuitive split keys (the defaults % and " still work) ---
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "-" split-window -v -c "#{pane_current_path}"

# --- let Neovim's OSC 52 clipboard reach the Windows clipboard through tmux ---
set -g allow-passthrough on
