# kelsier v0 — sourced from ~/.tmux.conf by install.sh
#
# Adds two things and nothing else: a fleet status line that knows agent state,
# and one key to jump to whichever agent is blocked on you. No prefix change,
# no rebinding of native window navigation.

# --- fleet status line ---
set -g status-left-length 140
set -g status-left "#($HOME/.local/bin/kel-status)"
set -g status-interval 15

# --- jump to the next waiting session ---
bind-key "`" run-shell "$HOME/.local/bin/kel-jump"

# --- let Neovim's OSC 52 clipboard reach the Windows clipboard through tmux ---
set -g allow-passthrough on
