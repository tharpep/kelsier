# kelsier v0 — sourced from ~/.tmux.conf by install.sh
#
# Adds: a state-aware fleet status line, one key to jump to whichever agent is
# blocked on you, and a keybinding cheatsheet. No prefix change, no rebinding of
# native window navigation.

# --- fleet status line (replaces tmux's own window list) ---
set -g status-left-length 200
set -g status-left "#($HOME/.local/bin/kel-status)"
set -g status-interval 15
set -g window-status-format ""
set -g window-status-current-format ""

# --- jump to the next waiting session ---
bind-key "`" run-shell "$HOME/.local/bin/kel-jump"

# --- keybinding cheatsheet (prefix k; q or any nav key closes it) ---
bind-key k display-popup -w 72 -h 90% -T " kel keys " -E "$HOME/.local/bin/kel-cheat | less -R -P 'kel keys  —  q to close'"

# --- let Neovim's OSC 52 clipboard reach the Windows clipboard through tmux ---
set -g allow-passthrough on
