# kelsier — sourced from ~/.tmux.conf by install.sh
#
# A state-aware fleet status line, a global jump-to-blocked key, a floating
# command menu, and a group picker. All keys are lowercase. No prefix change.

# --- fleet status line ---
# Each group's tmux session gets its own status-left (set by kel).  This global
# default covers the pre-v0.2 flat session and non-kel sessions.
set -g status-left-length 200
set -g status-left "#($HOME/.local/bin/kel status-line)"
set -g status-interval 15
set -g window-status-format ""
set -g window-status-current-format ""

# --- windows count from 1 (matches prefix 1..9); compact when one closes ---
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# --- label panes so a split isn't a mystery ---
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{pane_current_command} "

# --- mouse: scroll, click a pane to focus, drag a border to resize ---
# (text selection then needs Shift+drag)
set -g mouse on
# wheel: forward to apps that grab the mouse (nvim, lazygit); send PageUp/PageDown
# to any other full-screen TUI — that's how Claude Code scrolls its conversation;
# tmux scrollback for a plain shell.
bind -n WheelUpPane   if -Ft= "#{mouse_any_flag}" "send -M" "if -Ft= \"#{alternate_on}\" \"send -N3 PageUp\"   \"copy-mode -e\""
bind -n WheelDownPane if -Ft= "#{mouse_any_flag}" "send -M" "if -Ft= \"#{alternate_on}\" \"send -N3 PageDown\" \"copy-mode -e\""

# --- jump to the next waiting agent (any group) ---
bind-key "`" run-shell "$HOME/.local/bin/kel jump"

# --- snapshot the workspace shape whenever it changes / on detach ---
# (so `prefix d` — plain detach — already saves; there is no separate key)
set-hook -g client-detached      "run-shell -b '$HOME/.local/bin/kel snapshot'"
set-hook -g after-split-window   "run-shell -b '$HOME/.local/bin/kel snapshot'"
set-hook -g pane-exited          "run-shell -b '$HOME/.local/bin/kel snapshot'"

# --- fleet menu: every agent, press a key to jump ---
bind-key m run-shell "$HOME/.local/bin/kel menu"

# --- group picker (session tree; kel groups are the kel/* sessions) ---
bind-key g choose-tree -Zs

# --- intuitive split keys (the defaults % and " still work) ---
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "-" split-window -v -c "#{pane_current_path}"

# --- prefix k: floating menu of the common moves (all keys lowercase) ---
bind-key k display-menu -T "#[align=centre,fg=colour214] kel " -x C -y C \
  "new agent here"               n   "command-prompt -p 'name:' 'new-window -c \"#{pane_current_path}\" -n \"%%\" ; send-keys claude Enter'" \
  "next agent waiting on you"     "\`" "run-shell '$HOME/.local/bin/kel jump'" \
  "fleet menu (all groups)"       f   "run-shell '$HOME/.local/bin/kel menu'" \
  "switch group"                  g   "choose-tree -Zs" \
  "switch to a window"            w   "choose-tree -Zw" \
  "scroll this pane"              "[" "copy-mode" \
  "" \
  "split right   |"               "|" "split-window -h -c '#{pane_current_path}'" \
  "split down    -"               "-" "split-window -v -c '#{pane_current_path}'" \
  "zoom this pane"                z   "resize-pane -Z" \
  "" \
  "rename this window"            r   "command-prompt -I '#W' 'rename-window \"%%\"'" \
  "close this window"             x   "confirm-before -p 'close #W? (y/n)' kill-window" \
  "detach (agents keep running)"  d   "detach-client" \
  "" \
  "full cheatsheet"               "?" "display-popup -w 84 -h 85% -T ' kel keys ' -E '$HOME/.local/bin/kel cheat | less -R'"

# --- let Neovim's OSC 52 clipboard reach the Windows clipboard through tmux ---
set -g allow-passthrough on
