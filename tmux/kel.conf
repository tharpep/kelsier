# kelsier — sourced from ~/.tmux.conf by install.sh
#
# Keys (all lowercase; the tmux prefix is NOT changed):
#   prefix `    jump to the next agent waiting on you
#   prefix t    kel top — the fleet dashboard
#
# v0.10 also put every window in one session, so prefix g (pick a session)
# went: prefix 1..9 and prefix w reach everything.
#
# v0.10 removed the fzf board (Ctrl+Space / prefix b), the per-agent menu
# (prefix m) and kel cheat (prefix k): four overlapping surfaces with four
# key schemes.  The sidebar replaces them — docs/rollout.md § v0.10.

# --- fleet status line ---
# One global status-left: since v0.10 every kel window is in one session.
# (A v0.9 per-repo session still running carries its own; it drains away.)
set -g status-left-length 200
set -g status-left "#($HOME/.local/bin/kel status-line)"
set -g status-interval 15
set -g window-status-format ""
set -g window-status-current-format ""

# --- windows count from 1 (matches prefix 1..9); compact when one closes ---
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# --- label panes so a split isn't a mystery ---
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{pane_current_command} "

# --- mouse: scroll, click a pane to focus, drag a border to resize ---
# (text selection then needs Shift+drag)
set -g mouse on
# wheel: forward to apps that grab the mouse (nvim, lazygit); send PageUp/PageDown
# to any other full-screen TUI — that's how Claude Code scrolls its conversation;
# tmux scrollback for a plain shell.
bind -n WheelUpPane   if -Ft= "#{mouse_any_flag}" "send -M" "if -Ft= \"#{alternate_on}\" \"send -N3 PageUp\"   \"copy-mode -e\""
bind -n WheelDownPane if -Ft= "#{mouse_any_flag}" "send -M" "if -Ft= \"#{alternate_on}\" \"send -N3 PageDown\" \"copy-mode -e\""

# --- jump to the next waiting agent (any group) ---
bind-key "`" run-shell "$HOME/.local/bin/kel jump"

# --- snapshot the workspace shape whenever it changes / on detach ---
# (so `prefix d` — plain detach — already saves; there is no separate key)
#
# Every hook discards its output, on purpose: run-shell shows a command's
# stdout in view-mode on the active pane, and `kel snapshot` prints where it
# wrote.  Unsilenced, every split put the pane you were in into view-mode
# showing "kel snapshot -> …" — swallowing your keys until you pressed q.
set-hook -g client-detached      "run-shell -b '$HOME/.local/bin/kel snapshot >/dev/null 2>&1'"
set-hook -g after-split-window   "run-shell -b '$HOME/.local/bin/kel snapshot >/dev/null 2>&1'"
set-hook -g pane-exited          "run-shell -b '$HOME/.local/bin/kel _sidebar reap >/dev/null 2>&1; $HOME/.local/bin/kel snapshot >/dev/null 2>&1'"

# --- the sidebar (v0.10 M2): a fixed-width pane on the left of every kel window ---
# ensure is idempotent and ignores non-kel windows, so these may fire freely;
# kel new adds the sidebar itself — the hooks cover windows made by hand.
# reap (above) closes a window left holding only its sidebar.  `kel sidebar
# off` turns all of this off.
set-hook -g after-new-window       "run-shell -b '$HOME/.local/bin/kel _sidebar ensure #{window_id} >/dev/null 2>&1'"
set-hook -g session-created        "run-shell -b '$HOME/.local/bin/kel _sidebar ensure #{window_id} >/dev/null 2>&1'"
# a hidden sidebar does nothing until it is shown; these tell it it may be
set-hook -g session-window-changed "run-shell -b '$HOME/.local/bin/kel _sidebar wake >/dev/null 2>&1'"
set-hook -g client-session-changed "run-shell -b '$HOME/.local/bin/kel _sidebar wake >/dev/null 2>&1'"
# tmux resizes panes proportionally; keep the sidebar its configured width
set-hook -g window-resized         "run-shell -b '$HOME/.local/bin/kel _sidebar fit >/dev/null 2>&1'"

# The trailing `2>&1` on a foreground bind is deliberate, NOT tmux's
# `run-shell -E`: -E exists only from tmux 3.6 and kel's floor is 3.0, where a
# -E'd bind dies with "unknown flag -E" and takes the key with it.  run-shell
# shows stdout, never stderr, so this is what keeps a kel error visible.

# --- prefix t: the fleet dashboard (replaces tmux's clock — no loss) ---
bind-key t run-shell -b "$HOME/.local/bin/kel top 2>&1"


# --- rename the current window AND keep kel's metadata in sync ---
bind-key "," command-prompt -I "#W" { run-shell "$HOME/.local/bin/kel rename '%%'" }

# --- intuitive split keys (the defaults % and " still work) ---
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "-" split-window -v -c "#{pane_current_path}"

# --- let Neovim's OSC 52 clipboard reach the Windows clipboard through tmux ---
set -g allow-passthrough on
