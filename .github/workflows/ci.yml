name: ci

# "Does it work", not "is it stylish".  Style/shellcheck is a separate task.
# The point of the macOS job is that kel's portability bugs are silent under
# BSD userland — they take a wrong branch rather than erroring — so a human
# will not notice them and a runner will.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # one OS failing must not hide the other's result
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: install tmux + jq (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux jq

      - name: install tmux + jq (macos)
        if: runner.os == 'macOS'
        run: brew install tmux jq

      - name: versions
        run: tmux -V && jq --version && bash --version | head -1

      - name: syntax
        run: |
          bash -n bin/kel
          bash -n install.sh
          bash -n test/kel-test.sh
          bash -n completions/kel.bash
          for f in install/*.sh; do bash -n "$f"; done

      # tmux/kel.conf was never parsed by CI, which is how a menu that bound
      # `w` to two different items shipped: tmux takes the first match and the
      # shadowed item silently never fires.  The suite now checks menu keys for
      # uniqueness, but nothing checked that the file PARSES at all.
      # Isolated socket, because kill-server on the default one is how this
      # repo once killed a live workspace.
      - name: tmux/kel.conf parses
        run: |
          export TMUX_TMPDIR="$(mktemp -d /tmp/kelci.XXXXXX)"
          tmux -f /dev/null start-server \; source-file tmux/kel.conf \; kill-server
          rm -rf "$TMUX_TMPDIR"

      # A broken completion file is otherwise invisible until you press TAB on
      # a machine you just set up.  Guarded rather than assumed: zsh is the
      # macOS default but is not guaranteed on the Ubuntu image, and a missing
      # interpreter should skip the check, not redden the build.
      - name: zsh completion parses
        run: |
          command -v zsh >/dev/null || { echo "no zsh on this runner — skipped"; exit 0; }
          zsh -n completions/kel.zsh

      # `#!/usr/bin/env bash` finds Homebrew's bash 5 on a macOS runner, which
      # would hide a bash-4 construct that the Mac's stock /bin/bash (3.2,
      # frozen at GPLv2) would choke on.  Check against the old one explicitly.
      - name: syntax under macOS stock bash 3.2
        if: runner.os == 'macOS'
        run: /bin/bash --version | head -1 && /bin/bash -n bin/kel

      # Go is optional for kel — bin/kel falls back to its bash implementation
      # when kel-fleet is absent — but CI always has it, so CI always checks
      # that the two agree. That differential is the whole safety net for the
      # port: a disagreement is a failure, not a curiosity.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: go vet / build
        run: |
          go version
          go vet ./...
          go build ./...

      - name: regression suite
        run: ./test/kel-test.sh
